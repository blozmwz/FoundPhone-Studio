name: Verify reviewed Cloudflare release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build-frozen-release.mjs
      - run: node --test server/analytics/*.test.mjs
# Cloudflare Pages bdg deploys main through its existing Git integration.
# No second hosting target or author/test preview is deployed here.
